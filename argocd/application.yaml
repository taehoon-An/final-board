apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: final-board
  namespace: myargocd
spec:
  project: default
  source:
    repoURL: https://github.com/taehoon-An/final-board.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: board
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
