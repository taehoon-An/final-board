apiVersion: v1
kind: Service
metadata:
  name: board-backend
spec:
  selector: {app: board-backend}
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-backend
spec:
  replicas: 1
  selector:
    matchLabels: {app: board-backend}
  template:
    metadata:
      labels: {app: board-backend}
    spec:
      imagePullSecrets:
        - name: board-registry
      nodeSelector:
        kubernetes.io/hostname: myserver2
      initContainers:
        - name: init-db
          image: board-backend-image
          command: [flask, --app, "app:create_app()", init-db]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: board-db-secret, key: database-url}
      containers:
        - name: backend
          image: board-backend-image
          ports: [{containerPort: 8000}]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: board-db-secret, key: database-url}
          readinessProbe:
            httpGet: {path: /api/health, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 256Mi}
