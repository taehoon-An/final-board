apiVersion: v1
kind: Service
metadata:
  name: board-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  selector: {app: board-frontend}
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-frontend
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels: {app: board-frontend}
  template:
    metadata:
      labels: {app: board-frontend}
    spec:
      imagePullSecrets:
        - name: board-registry
      nodeSelector:
        kubernetes.io/hostname: myserver2
      containers:
        - name: frontend
          image: board-frontend-image
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /healthz, port: 80}
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
