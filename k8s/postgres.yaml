apiVersion: v1
kind: PersistentVolume
metadata:
  name: board-postgres-pv
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  capacity:
    storage: 2Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: board-local
  hostPath:
    path: /var/lib/cloud-board-postgres
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [myserver2]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: board-postgres-data
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: board-local
  volumeName: board-postgres-pv
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: board-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  selector:
    app: board-db
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: board-db
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: board-db
  template:
    metadata:
      labels:
        app: board-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: myserver2
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              value: board
            - name: POSTGRES_USER
              value: board
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: board-db-secret
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, board, -d, board]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: board-postgres-data
