<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Board | 클라우드 게시판</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#17243b;font:16px/1.6 system-ui,sans-serif}header{background:#15253e;color:white;padding:36px max(24px,calc((100vw - 1080px)/2))}header small{color:#a7c3ef;letter-spacing:2px}h1{margin:8px 0;font-size:32px}header p{margin:0;color:#ced9e8}main{max-width:1128px;margin:30px auto;padding:0 24px;display:grid;grid-template-columns:350px 1fr;gap:24px}.panel,article{background:white;border:1px solid #dde4ee;border-radius:14px;padding:24px}.panel{align-self:start}h2{margin:0 0 18px;font-size:21px}label{display:block;margin:16px 0 5px;font-weight:600}input,textarea{width:100%;border:1px solid #bdcadb;border-radius:7px;padding:10px;font:inherit}textarea{min-height:180px;resize:vertical}button{border:0;border-radius:7px;background:#245ee7;color:white;padding:10px 16px;font:inherit;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.secondary{background:#eaf0fc;color:#244a86}.danger{background:#fff0f0;color:#b32632}.actions{display:flex;gap:8px;margin-top:18px}article{margin:14px 0}article h3{margin:0;font-size:20px;overflow-wrap:anywhere}article p{white-space:pre-wrap;overflow-wrap:anywhere}time,.muted{font-size:13px;color:#63718a}.list-head{display:flex;justify-content:space-between;align-items:center}.list-head h2{margin:0}#message{min-height:28px;color:#2756ad;margin-top:14px}#status{font-size:13px;margin-top:14px;color:#b9d7ff}@media(max-width:760px){main{grid-template-columns:1fr}}
</style>
<header><small>CLOUD NATIVE · FINAL PROJECT</small><h1>Cloud Board</h1><p>자동 배포 테스트 게시판</p><div id="status">서버 연결 확인 중</div></header>
<main><section class="panel"><h2 id="form-title">새 글 작성</h2><form id="editor"><label for="title">제목</label><input id="title" maxlength="120" required placeholder="제목을 입력하세요"><label for="content">내용</label><textarea id="content" maxlength="10000" required placeholder="나누고 싶은 이야기를 작성하세요"></textarea><div class="actions"><button id="save" type="submit">등록하기</button><button id="cancel" class="secondary" type="button" hidden>수정 취소</button></div></form><div id="message" role="status" aria-live="polite"></div><p class="muted">실습용 공개 게시판입니다. 개인정보는 작성하지 마세요.</p></section><section><div class="list-head"><h2>게시글 <span id="count">0</span></h2><button class="secondary" id="refresh">새로고침</button></div><div id="posts" aria-live="polite"></div></section></main>
<script>
const $=id=>document.getElementById(id);let editing=null;
async function api(path,options={}){const r=await fetch('/api'+path,{...options,headers:{'Content-Type':'application/json'}});if(!r.ok){const d=await r.json().catch(()=>({}));throw Error(d.error||'요청에 실패했습니다.');}return r.status===204?null:r.json();}
function message(text){$('message').textContent=text;}
function reset(){editing=null;$('editor').reset();$('form-title').textContent='새 글 작성';$('save').textContent='등록하기';$('cancel').hidden=true;}
async function load(){try{const posts=await api('/posts');$('count').textContent=posts.length;$('posts').replaceChildren();if(!posts.length){const p=document.createElement('p');p.textContent='아직 글이 없어요. 첫 번째 글을 남겨보세요.';$('posts').append(p);}for(const post of posts){const card=document.createElement('article'),h=document.createElement('h3'),t=document.createElement('time'),p=document.createElement('p'),a=document.createElement('div');h.textContent=post.title;t.textContent='#'+post.id+' · '+new Date(post.created_at).toLocaleString('ko-KR');p.textContent=post.content;a.className='actions';const edit=document.createElement('button');edit.className='secondary';edit.textContent='수정';edit.onclick=()=>{editing=post.id;$('title').value=post.title;$('content').value=post.content;$('form-title').textContent='게시글 수정';$('save').textContent='수정 저장';$('cancel').hidden=false;$('title').focus();};const del=document.createElement('button');del.className='danger';del.textContent='삭제';del.onclick=async()=>{if(!confirm('이 글을 삭제할까요?'))return;try{await api('/posts/'+post.id,{method:'DELETE'});if(editing===post.id)reset();await load();message('삭제했습니다.');}catch(e){message(e.message);}};a.append(edit,del);card.append(h,t,p,a);$('posts').append(card);}}catch(e){message(e.message);}}
$('editor').onsubmit=async e=>{e.preventDefault();$('save').disabled=true;try{await api(editing?'/posts/'+editing:'/posts',{method:editing?'PUT':'POST',body:JSON.stringify({title:$('title').value,content:$('content').value})});reset();await load();message('저장했습니다.');}catch(e){message(e.message);}finally{$('save').disabled=false;}};
$('cancel').onclick=reset;$('refresh').onclick=load;
api('/health').then(d=>{$('status').textContent='API · DB 연결 정상 | 버전 '+d.version;}).catch(()=>{$('status').textContent='API 연결을 확인해 주세요.';});load();
</script></html>
